<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VALIS 器官アトラス一覧</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f1d;color:#e6ecfa;font:14px/1.6 system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}h1{font-weight:400;letter-spacing:.12em;margin:0}p{color:#aabbd2;margin:8px 0 20px}.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.family{border:1px solid #33465f;border-radius:6px;background:#101c2b;padding:12px}.family h2{margin:0 0 8px;font-size:16px;font-weight:500}.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}figure{margin:0;min-width:0}canvas{width:100%;display:block;aspect-ratio:1;image-rendering:pixelated;background:repeating-conic-gradient(#132035 0% 25%,#1b2d43 0% 50%) 50% / 16px 16px;border:1px solid #344a62;border-radius:3px}figcaption{text-align:center;font-size:12px;color:#a9c5e4}.error{color:#ffc4bd}@media(max-width:900px){.catalog{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:12px}.catalog{grid-template-columns:1fr}}
</style></head><body><main><h1>VALIS · 器官アトラス</h1><p>旧12系統のLv1〜3を比較できます。配置済みモックを参照したAI加工派生です。原画の切り出し・完成画質の承認とは区別します。</p><div class="catalog" id="catalog"></div><p id="result" role="status">画像を読み込み中…</p></main><script>
(async()=>{
 const names={abyss:'深淵触手',myth:'神鳥',recursive:'再帰知性',sail:'光帆',gravity:'重力環',crystal:'星晶',manyeyes:'多眼知覚',abyssshell:'深殻',parallel:'並列生命',memory:'記憶殻',serpent:'多頭蛇',solar:'日輪'};
 try{
  const response=await fetch('./assets/organs/ledger.json');if(!response.ok)throw Error('台帳を読み込めません');
  const ledger=await response.json();let rendered=0;
  for(const [id,row] of Object.entries(ledger)){
   const im=new Image();im.src='./'+row.path.replace(/^src\//,'');await im.decode();
   const section=document.createElement('section');section.className='family';section.dataset.lineage=id;
   const heading=document.createElement('h2');heading.textContent=names[id]+' / '+id;section.append(heading);
   const levels=document.createElement('div');levels.className='levels';
   row.regions.forEach((r,i)=>{
    const figure=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption');
    c.width=180;c.height=180;c.setAttribute('aria-label',names[id]+' Lv.'+(i+1));const g=c.getContext('2d');g.imageSmoothingEnabled=false;
    const scale=Math.min(180/r[2],180/r[3]);const w=r[2]*scale,h=r[3]*scale;
    g.drawImage(im,...r,(180-w)/2,(180-h)/2,w,h);caption.textContent='Lv.'+(i+1);figure.append(c,caption);levels.append(figure);rendered++;
   });section.append(levels);document.querySelector('#catalog').append(section);
  }document.querySelector('#result').textContent=Object.keys(ledger).length+'系統 / '+rendered+'領域を表示しました';document.body.dataset.ready='true';
 }catch(error){document.querySelector('#result').textContent=error.message;document.querySelector('#result').className='error';throw error;}
})();
</script></body></html>
