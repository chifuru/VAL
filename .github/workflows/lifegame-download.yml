name: LifeGame Windows download
on:
  push:
    branches: [main]
    paths: ['lifegame-desktop/**', '.github/workflows/lifegame-download.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lifegame-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: lifegame-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lifegame-desktop/package-lock.json
      - id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: LifeGame-Windows-x64-${{ steps.version.outputs.value }}
          path: |
            lifegame-desktop/dist/LifeGame-Windows-x64.zip
            lifegame-desktop/dist/LifeGame-Windows-x64.zip.sha256
            lifegame-desktop/dist/package-report.json
          if-no-files-found: error
          retention-days: 30
