name: VALIS desktop source and Chromium checks
on:
  push:
    branches: [main, 'work/valis-*']
    paths: ['gas-fizzbuzz-webapp/**', '.github/workflows/gas-fizzbuzz-stage5.yml']
  pull_request:
    paths: ['gas-fizzbuzz-webapp/**', '.github/workflows/gas-fizzbuzz-stage5.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gas-fizzbuzz-webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gas-fizzbuzz-webapp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:assets
      - run: npx playwright install --with-deps chromium
      - name: Observation UI and actual PNG drawing
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory src > /tmp/valis-http.log 2>&1 &
          for attempt in $(seq 1 20); do curl --fail --silent http://127.0.0.1:8766/Index.html -o /tmp/valis-ui.html && break; sleep 1; done
          cmp /tmp/valis-ui.html src/Index.html
          mkdir -p artifacts/ci-diagnostics
          for suite in browser motion performance; do
            if npm run "test:$suite" > "artifacts/ci-diagnostics/$suite.log" 2>&1; then
              cat "artifacts/ci-diagnostics/$suite.log"
            else
              cat "artifacts/ci-diagnostics/$suite.log"
              while IFS= read -r line; do
                line="${line//'%'/'%25'}"
                line="${line//$'\r'/'%0D'}"
                echo "::error::$line"
              done < <(tail -35 "artifacts/ci-diagnostics/$suite.log")
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valis-desktop-browser-evidence
          path: |
            gas-fizzbuzz-webapp/artifacts/desktop-browser/
            gas-fizzbuzz-webapp/artifacts/desktop-motion/
            gas-fizzbuzz-webapp/artifacts/desktop-performance/
            gas-fizzbuzz-webapp/artifacts/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 30
