<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, VALIS</title>
<style>
:root{color-scheme:dark;--ink:#050c12;--light:#c2f9ed;--signal:#7be5cc;--pink:#f18cce}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--light);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow:hidden}
button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--pink);outline-offset:6px}
#world{position:fixed;inset:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 47%,#10303366,transparent 55%),#050c12}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 4px,#0002 4px 5px);opacity:.35}
.frame{position:fixed;inset:26px;border:1px solid #81cfbe24;pointer-events:none}.frame:before,.frame:after{content:'+';position:absolute;color:#81cfbe80;font-size:20px}.frame:before{left:-6px;top:-13px}.frame:after{right:-6px;bottom:-13px}
header{position:fixed;top:52px;left:56px;right:56px;display:flex;justify-content:space-between;gap:20px;pointer-events:none;font-size:10px;letter-spacing:.2em;color:#85aea8}.mark{color:#dcfff3}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#8af0d0;margin-right:10px;box-shadow:0 0 12px #8af0d0}
main{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}
.center{text-align:center;width:100%;padding:24px}.eyebrow{font-size:10px;letter-spacing:.4em;color:#75938f;margin-bottom:30px}
#contact{pointer-events:auto;position:relative;border:0;background:none;padding:24px 4px;cursor:pointer;max-width:100%}
h1{margin:0;font:300 clamp(36px,7.4vw,108px)/1.1 Georgia,'Times New Roman',serif;white-space:nowrap;letter-spacing:.035em;color:#d3fff0;text-shadow:0 0 32px #77d4b536;transition:color 5s,text-shadow 3s,letter-spacing 6s;}
.letter{display:inline-block;animation:assemble 3.5s both;animation-delay:calc(var(--i)*.075s);transition:transform 5s,opacity 4s,filter 4s}.space{width:.28em}
@keyframes assemble{from{opacity:0;filter:blur(9px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
#contact:before,#contact:after{content:'';position:absolute;left:50%;top:50%;width:min(60vw,580px);height:240px;border:1px solid #79c6b512;border-radius:50%;transform:translate(-50%,-50%) rotate(-18deg);pointer-events:none}#contact:after{transform:translate(-50%,-50%) rotate(18deg);height:170px}
body[data-phase="侵食"] h1{letter-spacing:.065em;color:#b4d6eb}body[data-phase="侵食"] .letter:nth-child(3n){transform:translateY(-5px);filter:blur(.6px);opacity:.65}
body[data-phase="交信"] h1{color:#f4c1e7;text-shadow:0 0 48px #e784ce55}body[data-phase="同調"] .letter:nth-child(2n){transform:translateY(3px)}
body[data-phase="再構成"] h1{letter-spacing:.025em}
.echo h1{color:#fff0fb!important;text-shadow:0 0 58px #ee8bcd90!important}
.subtitle{font:11px/2.2 ui-monospace,monospace;color:#709990;letter-spacing:.16em;margin-top:28px}.subtitle span{display:block;font-size:9px;letter-spacing:.28em;color:#54756f}
footer{position:fixed;bottom:49px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:end;gap:16px;font-size:10px;letter-spacing:.1em}.phase{color:#84b5a9}.phase small{display:block;font-size:8px;color:#526e68;margin-bottom:8px;letter-spacing:.2em}.controls{display:flex;gap:8px}.controls button{border:1px solid #81cfbe35;background:#07151cbb;padding:11px 15px;border-radius:3px;font-size:10px;cursor:pointer}.controls button:hover{background:#173130}
.paused .letter{animation-play-state:paused}.paused h1,.paused .letter{transition:none}
@media(max-width:600px){.frame{inset:14px}header{top:34px;left:30px;right:30px}header .right{display:none}footer{left:30px;right:30px;bottom:32px}.eyebrow{font-size:8px;letter-spacing:.24em}.subtitle{font-size:10px;letter-spacing:.06em}.controls button{padding:10px}.center{padding:16px}#contact:before{height:150px}#contact:after{height:110px}}
@media(prefers-reduced-motion:reduce){.letter{animation:none!important;transform:none!important;filter:none!important;opacity:1!important}h1,.letter{transition:none!important}}
</style>
</head>
<body data-phase="出現">
<canvas id="world" aria-hidden="true"></canvas><div class="scan"></div><div class="frame"></div>
<header><span class="mark"><i class="dot"></i>V A L I S / LIVING FIELD</span><span class="right">AN INTELLIGENCE, ALMOST REMEMBERED.</span></header>
<main><div class="center"><div class="eyebrow">SOMEWHERE BETWEEN CIRCUIT AND CELL</div>
<button id="contact" aria-label="Hello, VALIS — 空間に信号を送る"><h1 aria-label="Hello, VALIS"><span id="letters" aria-hidden="true">Hello, VALIS</span></h1></button>
<p class="subtitle">触れる。どこかで、何かが応える。<span>TOUCH THE FIELD. WAIT FOR AN ECHO.</span></p></div></main>
<footer><div class="phase"><small>STATE OF THE FIELD</small><span id="phase">出現 / EMERGENCE</span></div><div class="controls"><button id="pause" aria-pressed="false">動きを止める</button><button id="reset">初期化</button></div></footer>
<script>
'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const contact=document.getElementById('contact'),pauseButton=document.getElementById('pause');
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const phases=['出現','同調','侵食','交信','再構成'],english=['EMERGENCE','RESONANCE','INTRUSION','CONTACT','REASSEMBLY'];
const state={time:0,energy:0,particles:[],signals:[],pending:null,echoes:0,echoUntil:0,paused:false,reduced:motion.matches,phase:0,width:1,height:1};
const MAX_PARTICLES=100,MAX_SIGNALS=24;
let raf=0,last=0;
document.getElementById('letters').replaceChildren(...Array.from('Hello, VALIS', (char,i)=>{
 const span=document.createElement('span');span.className='letter'+(char===' '?' space':'');span.style.setProperty('--i',i);span.textContent=char;return span;
}));
function addParticle(x,y,kind=0){
 if(state.particles.length>=MAX_PARTICLES)state.particles.shift();
 state.particles.push({x,y,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,age:0,life:35+Math.random()*55,kind,seed:Math.random()*6.28});
}
function addSignal(x,y,kind){
 if(state.signals.length>=MAX_SIGNALS)state.signals.shift();
 state.signals.push({x,y,kind,age:0,life:kind==='echo'?2.4:3});
}
function resize(){
 const oldW=state.width,oldH=state.height;state.width=innerWidth;state.height=innerHeight;
 const dpr=Math.min(devicePixelRatio||1,2);canvas.width=state.width*dpr;canvas.height=state.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 for(const p of state.particles){p.x=p.x/oldW*state.width;p.y=p.y/oldH*state.height;}draw();
}
function setPhase(){
 const phase=Math.floor((state.time+state.energy*8)/18)%phases.length;state.phase=phase;
 document.body.dataset.phase=phases[phase];document.getElementById('phase').textContent=phases[phase]+' / '+english[phase];
 document.body.classList.toggle('echo',state.time<state.echoUntil);
}
function stimulate(x,y){
 if(state.paused||document.hidden)return;
 state.energy=Math.min(1,state.energy+.13);addSignal(x,y,'ring');
 const roll=Math.random(),n=state.particles.length;
 // Small shared motifs recur; the density changes which events are likely.
 if(roll<.08){addSignal(state.width-x,state.height-y,'pink');for(let i=0;i<5;i++)addParticle(state.width-x+(i-2)*12,state.height-y,1);}
 else if(n<45||roll<.45){for(let i=0;i<6;i++)addParticle(x+(Math.random()-.5)*50,y+(Math.random()-.5)*50);}
 else if(roll<.8){for(const p of state.particles){const d=Math.hypot(p.x-x,p.y-y);if(d<200){p.vx+=(x-p.x)*.08;p.vy+=(y-p.y)*.08;}}}
 else{for(let i=0;i<4;i++)addParticle(x+(i-1.5)*18,y+(i%2)*18,1);}
 state.pending={x,y,at:state.time+3};
 if(state.reduced){state.pending=null;state.echoes++;state.echoUntil=state.time+1;state.time+=1;}
 setPhase();draw();
}
function advance(dt){
 state.time+=dt;state.energy=Math.max(0,state.energy-dt*.018);
 if(state.pending&&state.time>=state.pending.at){addSignal(state.pending.x,state.pending.y,'echo');state.pending=null;state.echoes++;}
 for(const s of state.signals){s.age+=dt;if(s.kind==='echo'&&s.age>=s.life*.8)state.echoUntil=state.time+2;}
 state.signals=state.signals.filter(s=>s.age<s.life);
 for(const p of state.particles){p.age+=dt;p.vx*=Math.exp(-dt*.05);p.vy*=Math.exp(-dt*.05);p.x+=(p.vx+Math.sin(state.time*.2+p.seed)*3)*dt;p.y+=(p.vy+Math.cos(state.time*.15+p.seed)*3)*dt;p.x=(p.x+state.width)%state.width;p.y=(p.y+state.height)%state.height;}
 state.particles=state.particles.filter(p=>p.age<p.life);
 if(state.particles.length<30)addParticle(Math.random()*state.width,Math.random()*state.height);
 setPhase();
}
function draw(){
 const w=state.width,h=state.height;ctx.clearRect(0,0,w,h);
 for(let i=0;i<state.particles.length;i++){
  const p=state.particles[i],alpha=Math.min(1,(p.life-p.age)/6);
  for(let j=i+1;j<state.particles.length;j++){
   const q=state.particles[j],d=Math.hypot(p.x-q.x,p.y-q.y);
   if(d<130){ctx.strokeStyle=`rgba(103,199,176,${(1-d/130)*.2*alpha})`;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo((p.x+q.x)/2,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}
  }
  ctx.fillStyle=p.kind?`rgba(238,138,204,${alpha*.8})`:`rgba(141,231,210,${alpha*.7})`;
  ctx.beginPath();ctx.arc(p.x,p.y,p.kind?2:1.3,0,Math.PI*2);ctx.fill();
  if(i%9===0){ctx.strokeStyle=`rgba(103,199,176,${alpha*.18})`;ctx.beginPath();ctx.arc(p.x,p.y,7+Math.sin(state.time*.5+p.seed)*2,0,Math.PI*2);ctx.stroke();}
 }
 // Growth from the readable text's boundary, rather than obscuring its core.
 const bounds=contact.getBoundingClientRect();
 if(state.phase===2||state.phase===3){ctx.strokeStyle='rgba(142,217,207,.22)';ctx.lineWidth=.7;for(let i=0;i<9;i++){const x=bounds.left+bounds.width*(i+1)/10,y=bounds.bottom-20,len=18+22*Math.sin(state.time*.16+i);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+8,y+len);ctx.lineTo(x+28,y+len+5);ctx.stroke();}}
 for(const s of state.signals){const t=s.age/s.life;ctx.lineWidth=1;ctx.strokeStyle=s.kind==='pink'?`rgba(239,129,198,${.5*(1-t)})`:`rgba(155,245,219,${.5*(1-t)})`;ctx.beginPath();
  if(s.kind==='echo'){const x=s.x+(w/2-s.x)*t,y=s.y+(h/2-s.y)*t;ctx.moveTo(s.x,s.y);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle='#efbddc';ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();}
  else{ctx.arc(s.x,s.y,8+t*(s.kind==='pink'?250:100),0,Math.PI*2);ctx.stroke();}
 }
}
function running(){return !state.paused&&!state.reduced&&!document.hidden;}
function frame(now){raf=0;if(!running())return;const dt=last?Math.min((now-last)/1000,.05):0;last=now;advance(dt);draw();raf=requestAnimationFrame(frame);}
function schedule(){cancelAnimationFrame(raf);raf=0;last=0;if(running())raf=requestAnimationFrame(frame);}
function reset(){state.time=0;state.energy=0;state.particles=[];state.signals=[];state.pending=null;state.echoes=0;state.echoUntil=0;for(let i=0;i<36;i++)addParticle(Math.random()*state.width,Math.random()*state.height);setPhase();draw();}
canvas.addEventListener('pointerdown',e=>{if(e.button===0)stimulate(e.clientX,e.clientY);});
contact.addEventListener('click',e=>{const b=contact.getBoundingClientRect();stimulate(e.detail?e.clientX:b.x+b.width/2,e.detail?e.clientY:b.y+b.height/2);});
pauseButton.addEventListener('click',()=>{state.paused=!state.paused;pauseButton.setAttribute('aria-pressed',String(state.paused));pauseButton.textContent=state.paused?'動きを再開':'動きを止める';document.body.classList.toggle('paused',state.paused);schedule();});
document.getElementById('reset').addEventListener('click',reset);
document.addEventListener('visibilitychange',schedule);
motion.addEventListener('change',()=>{state.reduced=motion.matches;state.pending=null;schedule();draw();});
addEventListener('resize',resize);resize();reset();schedule();
</script>
</body>
</html>
