<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VALIS — Neon Interface</title>
  <style>
    :root { color-scheme: dark; --pink: #ff47c8; --violet: #aa83ff; --ink: #090611; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100svh; padding: 28px clamp(20px, 5vw, 80px); display: flex; flex-direction: column; justify-content: center; background: var(--ink); color: #faf5ff; font-family: Arial, "Noto Sans JP", sans-serif; }
    button { font: inherit; }
    .scene { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; background: radial-gradient(ellipse at 78% 40%, #421338 0%, transparent 58%), radial-gradient(ellipse at 5% 80%, #251346 0%, transparent 52%); }
    .scene::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 3px, #00000020 3px 4px); opacity: .3; }
    .glow { position: absolute; width: 420px; height: 420px; border-radius: 50%; background: #ff29b5; filter: blur(130px); opacity: .15; top: 8%; right: -100px; animation: drift 14s ease-in-out infinite alternate; }
    .glow.second { width: 280px; height: 280px; top: 65%; left: -80px; background: #9655ff; animation-delay: -7s; }
    .grid { position: absolute; inset: 50% -80% -60%; background-image: linear-gradient(#ff47c833 1px, transparent 1px), linear-gradient(90deg, #ff47c833 1px, transparent 1px); background-size: 64px 64px; transform: perspective(420px) rotateX(62deg); transform-origin: center top; mask-image: linear-gradient(transparent, #000 30%, transparent); animation: grid-travel 8s linear infinite; }
    .shell { width: 100%; max-width: 1180px; margin: auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 40px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 19px; letter-spacing: .22em; font-weight: 700; }
    .mark { width: 30px; height: 30px; color: var(--pink); filter: drop-shadow(0 0 10px #ff47c877); }
    .motion-toggle { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 10px 16px; border: 1px solid #f9d3ff33; border-radius: 24px; background: #ffffff06; color: #e1d4eb; font-size: 12px; cursor: pointer; transition: background .2s, border-color .2s; }
    .motion-toggle:hover { border-color: var(--pink); background: #ff47c815; }
    .motion-toggle:focus-visible { outline: 2px solid #ffb8ed; outline-offset: 4px; }
    .motion-toggle:disabled { cursor: default; opacity: .7; }
    .motion-toggle svg { width: 14px; height: 14px; }
    .stage { position: relative; isolation: isolate; overflow: hidden; border: 1px solid #ef80d440; border-radius: 24px; background: linear-gradient(135deg, #15101fe8, #14091ee0); box-shadow: 0 30px 100px #0008, 0 0 65px #ff29b510, inset 0 1px 0 #ffffff09; }
    .stage::before { content: ""; position: absolute; top: 0; left: 7%; right: 7%; height: 1px; background: linear-gradient(90deg, transparent, var(--pink), transparent); box-shadow: 0 0 20px var(--pink); }
    .content { position: relative; z-index: 2; padding: clamp(32px, 6vw, 76px); }
    .eyebrow { display: flex; align-items: center; gap: 12px; color: #ff9ddd; font-size: 11px; font-weight: 700; letter-spacing: .28em; margin: 0 0 32px; }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 16px var(--pink); animation: signal 4s ease-in-out infinite; }
    h1 { margin: 0; font-size: clamp(70px, 10.6vw, 146px); font-weight: 800; line-height: .96; letter-spacing: -.065em; }
    h1 span { display: block; }
    .hello { color: #fff3ff; }
    .neon { color: var(--pink); text-shadow: 0 0 30px #ff47c84d, 0 0 80px #ff47c833; margin-top: 10px; }
    .description { color: #c3b3ce; font-size: clamp(13px, 1.5vw, 16px); letter-spacing: .12em; line-height: 1.8; margin: 32px 0 52px; }
    .bottomline { display: flex; align-items: center; gap: 20px; max-width: 390px; color: #b9a4c9; font-family: monospace; font-size: 10px; letter-spacing: .16em; }
    .bottomline .line { flex: 1; height: 1px; background: linear-gradient(90deg, #ff47c8aa, #ff47c800); }
    .orbit { position: absolute; z-index: 1; width: 440px; height: 440px; right: -90px; top: 65px; border: 1px solid #ff47c82b; border-radius: 50%; transform: rotate(-25deg); }
    .orbit::before { content: ""; position: absolute; inset: 42px; border: 1px dashed #d59cff2e; border-radius: 50%; animation: orbit-spin 60s linear infinite; }
    .orbit::after { content: ""; position: absolute; inset: -1px; border-radius: 50%; border: 2px solid transparent; border-top-color: #ff47c8bb; border-right-color: #ff47c820; filter: drop-shadow(0 0 10px #ff47c880); animation: orbit-spin 18s linear infinite; }
    .core { position: absolute; inset: 112px; border-radius: 50%; background: radial-gradient(circle at 36% 35%, #ffb3ec, #f31bad 20%, #870658 47%, #17091b 70%); box-shadow: 0 0 75px #ff2dbf40, inset -10px -10px 50px #090611; animation: float 7s ease-in-out infinite; }
    .core::after { content: ""; position: absolute; inset: 16px; border-radius: 50%; border: 1px solid #ffd0f340; }
    .spark { position: absolute; width: 5px; height: 5px; background: #ffc0ef; border-radius: 50%; box-shadow: 0 0 16px #ff47c8; animation: float 6s ease-in-out infinite; }
    .spark.one { right: 22%; top: 12%; }
    .spark.two { right: 8%; top: 70%; animation-delay: -2s; }
    .spark.three { right: 37%; top: 82%; animation-delay: -4s; }
    .footer { display: flex; justify-content: space-between; gap: 14px; margin-top: 24px; color: #a991ba; font-family: monospace; font-size: 10px; letter-spacing: .13em; }
    .footer strong { color: #f199d0; font-weight: 400; }
    .motion-paused *, .motion-paused *::before, .motion-paused *::after { animation-play-state: paused !important; }
    @keyframes grid-travel { to { background-position: 0 64px, 0 64px; } }
    @keyframes drift { to { transform: translate(-50px, 45px) scale(1.15); } }
    @keyframes orbit-spin { to { transform: rotate(360deg); } }
    @keyframes float { 50% { transform: translateY(-16px); } }
    @keyframes signal { 50% { opacity: .55; box-shadow: 0 0 7px var(--pink); } }
    @media (max-width: 700px) {
      body { padding: 24px 20px; }
      .topbar { margin-bottom: 24px; }
      .brand { font-size: 15px; gap: 8px; }
      .mark { width: 24px; height: 24px; }
      .content { padding: 36px 26px; }
      .eyebrow { font-size: 9px; letter-spacing: .2em; }
      h1 { font-size: clamp(64px, 18vw, 110px); }
      .description { max-width: 22em; margin-bottom: 110px; font-size: 12px; letter-spacing: .04em; }
      .orbit { width: 280px; height: 280px; right: -140px; top: 200px; opacity: .55; }
      .orbit::before { inset: 28px; }
      .core { inset: 74px; }
      .bottomline { font-size: 9px; gap: 10px; }
      .footer { font-size: 8px; letter-spacing: .07em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"><div class="glow"></div><div class="glow second"></div><div class="grid"></div></div>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 2 30 10v12L16 30 2 22V10Z" stroke="currentColor"/><path d="m8 11 8 12 8-12M16 2v5M2 22l5-3M30 22l-5-3" stroke="currentColor" stroke-width="2"/></svg>VALIS</div>
      <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false" aria-label="アニメーションを停止" hidden>
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zm5 0h3v10H9z"/></svg><span>動きを止める</span>
      </button>
    </header>
    <main class="stage">
      <div class="orbit" aria-hidden="true"><div class="core"></div></div>
      <div class="spark one" aria-hidden="true"></div><div class="spark two" aria-hidden="true"></div><div class="spark three" aria-hidden="true"></div>
      <div class="content">
        <p class="eyebrow">A NEW SIGNAL</p>
        <h1><span class="hello">Hello,</span> <span class="neon">VALIS</span></h1>
        <p class="description">ここから、未来をはじめよう。</p>
        <div class="bottomline" aria-hidden="true"><span>01 / HELLO WORLD</span><span class="line"></span><span>NEON EDITION</span></div>
      </div>
    </main>
    <footer class="footer" aria-hidden="true"><span>DIGITAL SPACE <strong>// 001</strong></span><span>BUILT FOR THE NEXT SIGNAL ↗</span></footer>
  </div>
  <script>
    const toggle = document.getElementById('motion-toggle');
    const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
    function setPaused(paused) {
      document.body.classList.toggle('motion-paused', paused);
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.setAttribute('aria-label', paused ? 'アニメーションを再開' : 'アニメーションを停止');
      toggle.querySelector('span').textContent = paused ? '動きを再開' : '動きを止める';
    }
    function applyPreference() {
      setPaused(preference.matches);
      toggle.disabled = preference.matches;
      if (preference.matches) {
        toggle.querySelector('span').textContent = '動きはオフ';
        toggle.setAttribute('aria-label', '端末の設定によりアニメーションを停止しています');
      }
    }
    applyPreference();
    toggle.hidden = false;
    toggle.addEventListener('click', () => setPaused(!document.body.classList.contains('motion-paused')));
    preference.addEventListener('change', applyPreference);
  </script>
</body>
</html>
